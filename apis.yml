name: Aggra
description: Aggra Technologies Private Limited operates Moneytor, an autonomous,
  self-learning platform for stressed loan recovery. Founded in 2017 in Mumbai, India
  by Ayush Srivastava and Anubhav Singh, Moneytor delivers debt management, collections,
  enterprise collections software, and distressed-debt / portfolio purchase solutions
  to lenders. The SaaS platform applies machine learning and automation to digitize
  the collections process — automating settlements, offering borrowers customized
  repayment plans, orchestrating multi-channel borrower communications, tracking overdue
  accounts, sending automated reminders, and surfacing real-time reporting and analytics
  — helping lenders collect and liquidate their consumer loan portfolios. Backed by
  500 Global.
